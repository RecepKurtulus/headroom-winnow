site_name: Winnow
site_description: Separate the grain from the chaff in your coding agent's tool output. A task-aware pruner for Headroom.
site_url: https://recepkurtulus.github.io/headroom-winnow/
repo_url: https://github.com/RecepKurtulus/headroom-winnow
repo_name: RecepKurtulus/headroom-winnow
edit_uri: edit/main/docs/
copyright: Winnow · Apache-2.0 · built on Headroom and Squeez

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            filters: ["!^_"]

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Guide:
      - How it works: guide/how-it-works.md
      - Models: guide/models.md
      - Benchmarks: guide/benchmarks.md
      - Training a model: guide/training.md
      - Limitations: guide/limitations.md
  - API reference:
      - Compressor: api/compressor.md
      - Backends: api/backends.md
      - Selection and markers: api/selection.md
  - Development: development.md
